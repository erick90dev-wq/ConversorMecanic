<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mecánico Pro ⚡</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #f1f5f9; --std: #4ade80; --spec: #fbbf24; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 10px; }
        
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 15px; width: 100%; max-width: 500px; }
        .tab-btn { flex: 1; padding: 12px; border: none; border-radius: 12px; background: #1e293b; color: #94a3b8; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: var(--accent); color: var(--bg); }

        .container { width: 100%; max-width: 500px; }
        .view { display: none; }
        .view.active { display: block; }

        /* TABLAS ESTILO PROFESIONAL */
        .table-card { background: var(--card); border-radius: 20px; padding: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .search-table { width: 100%; padding: 10px; margin-bottom: 15px; background: #0f172a; border: 1px solid #334155; border-radius: 10px; color: white; }
        
        .table-wrapper { max-height: 65vh; overflow-y: auto; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        thead { position: sticky; top: 0; background: #334155; }
        th { color: var(--accent); text-align: left; padding: 12px 8px; font-size: 0.7rem; text-transform: uppercase; }
        td { padding: 8px; border-bottom: 1px solid #334155; color: #cbd5e1; }
        
        /* Resaltado de filas principales (enteros y medios) */
        .row-main { background: rgba(56, 189, 248, 0.1) !important; font-weight: bold; color: white; }
        tr:hover { background: rgba(255,255,255,0.05); }

        .frac-col { color: var(--accent); font-weight: 600; width: 30%; }
        .mm-col { color: var(--std); width: 35%; }
        .dec-col { color: #94a3b8; width: 35%; }

        /* Estilo Calculadora */
        .card { background: var(--card); padding: 25px; border-radius: 24px; text-align: center; }
        .input-group { margin-bottom: 15px; text-align: left; position: relative; }
        input { width: 100%; padding: 15px; background: #0f172a; border: 2px solid #334155; border-radius: 12px; color: white; font-size: 1.2rem; box-sizing: border-box; }
        .helper-btns { display: none; position: absolute; right: 8px; bottom: 5px; gap: 5px; }
        .tool-btn { background: var(--accent); border: none; border-radius: 8px; width: 40px; height: 40px; font-weight: bold; }
        .result-container { margin-top: 15px; background: #0f172a; border-radius: 15px; padding: 20px; min-height: 100px; }
        .main-res { font-size: 2.5rem; font-weight: 800; color: var(--accent); }
    </style>
</head>
<body>

<div class="nav-tabs">
    <button class="tab-btn active" onclick="switchView('calc')">Calculadora</button>
    <button class="tab-btn" onclick="switchView('tables')">Tablas</button>
</div>

<div class="container">
    <div id="calcView" class="view active">
        <div class="card">
            <h2 style="margin:0 0 15px 0">Mecánico Pro ⚡</h2>
            <select id="mode" onchange="toggleMode()" style="width:100%; padding:10px; border-radius:10px; margin-bottom:15px; background:#0f172a; color:white;">
                <option value="mm_to_in">mm ➔ Pulgadas</option>
                <option value="in_to_mm">Pulgadas ➔ mm</option>
            </select>
            <div class="input-group">
                <input type="text" id="input" inputmode="decimal" placeholder="Ej: 1 1/2" oninput="convert()">
                <div id="helperBtns" class="helper-btns">
                    <button class="tool-btn" onclick="addChar(' ')">␣</button>
                    <button class="tool-btn" onclick="addChar('/')">/</button>
                </div>
            </div>
            <div class="result-container" id="resBox">
                <div style="color: #475569;">Introduce una medida...</div>
            </div>
        </div>
    </div>

    <div id="tablesView" class="view">
        <div class="table-card">
            <input type="text" id="tableSearch" class="search-table" placeholder="🔍 Buscar medida (ej: 1/64 o 2.5)..." oninput="filterTable()">
            <div class="table-wrapper">
                <table id="equivTable">
                    <thead>
                        <tr>
                            <th>Fracción</th>
                            <th>mm</th>
                            <th>Decimal</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // --- LÓGICA DE NAVEGACIÓN ---
    function switchView(view) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(view + 'View').classList.add('active');
        event.currentTarget.classList.add('active');
    }

    // --- GENERADOR DE TABLA (Basado en tu imagen) ---
    const tableBody = document.getElementById('tableBody');
    const gcd = (a, b) => b ? gcd(b, a % b) : a;

    function generateTable() {
        let html = '';
        // Generamos incrementos de 1/64 hasta 3 pulgadas (64 * 3 = 192 pasos)
        for (let i = 1; i <= 192; i++) {
            const dec = i / 64;
            const mm = dec * 25.4;
            
            const entero = Math.floor(i / 64);
            const num = i % 64;
            let fracTxt = "";

            if (num === 0) {
                fracTxt = entero + '"';
            } else {
                const common = gcd(num, 64);
                fracTxt = (entero > 0 ? entero + " " : "") + (num/common) + "/" + (64/common) + '"';
            }

            // Resaltar filas de medidas principales (enteros, medios, cuartos)
            const isMain = (num % 16 === 0); 
            const rowClass = isMain ? 'class="row-main"' : '';

            html += `<tr ${rowClass}>
                <td class="frac-col">${fracTxt}</td>
                <td class="mm-col">${mm.toFixed(3)} mm</td>
                <td class="dec-col">${dec.toFixed(4)}"</td>
            </tr>`;
        }
        tableBody.innerHTML = html;
    }

    function filterTable() {
        const input = document.getElementById('tableSearch').value.toLowerCase();
        const rows = document.getElementById('tableBody').getElementsByTagName('tr');
        for (let row of rows) {
            row.style.display = row.innerText.toLowerCase().includes(input) ? '' : 'none';
        }
    }

    // --- LÓGICA CALCULADORA ---
    function toggleMode() {
        const mode = document.getElementById('mode').value;
        document.getElementById('helperBtns').style.display = (mode === 'in_to_mm') ? 'flex' : 'none';
        convert();
    }

    function addChar(c) {
        const i = document.getElementById('input');
        i.value += c; i.focus(); convert();
    }

    function convert() {
        const raw = document.getElementById('input').value.trim();
        const mode = document.getElementById('mode').value;
        const resBox = document.getElementById('resBox');
        if(!raw) { resBox.innerHTML = "Esperando..."; return; }
        
        let val = 0;
        if(raw.includes(' ')) {
            const parts = raw.split(/\s+/);
            const f = parts[1].split('/');
            val = parseFloat(parts[0]) + (parseFloat(f[0])/parseFloat(f[1]));
        } else if(raw.includes('/')) {
            const f = raw.split('/');
            val = parseFloat(f[0])/parseFloat(f[1]);
        } else { val = parseFloat(raw.replace(',','.')); }

        if(isNaN(val)) return;

        if(mode === 'in_to_mm') {
            const mm = val * 25.4;
            resBox.innerHTML = `<div class="main-res">${mm.toFixed(2)}mm</div><div style="color:var(--std)">Aprox: ${Math.round(mm)}mm</div>`;
        } else {
            const inches = val / 25.4;
            resBox.innerHTML = `<div class="main-res">${toFrac(inches)}</div><div style="color:#94a3b8">Decimal: ${inches.toFixed(4)}"</div>`;
        }
    }

    function toFrac(dec) {
        const d = 64; // Precisión máxima según tu tabla
        let n = Math.round(dec * d);
        const entero = Math.floor(n / d);
        n = n % d;
        if (n === 0) return entero + '"';
        const common = gcd(n, d);
        return (entero > 0 ? entero + " " : "") + (n/common) + "/" + (d/common) + '"';
    }

    generateTable();
</script>
</body>
</html>
