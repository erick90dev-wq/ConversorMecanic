<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mecánico Pro ⚡</title>
    <style>
        :root { 
            --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #f1f5f9; 
            --std: #4ade80; --spec: #fbbf24; --input-bg: #0f172a; --border: rgba(255,255,255,0.1);
        }
        .light-mode {
            --bg: #f1f5f9; --card: #ffffff; --accent: #0284c7; --text: #1e293b;
            --std: #16a34a; --spec: #d97706; --input-bg: #f8fafc; --border: rgba(0,0,0,0.1);
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; transition: 0.3s; }

        .top-header { width: 100%; max-width: 450px; display: flex; align-items: center; justify-content: center; position: relative; padding: 15px 0; }
        .top-header h2 { margin: 0; background: linear-gradient(to right, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 1.8rem; }
        .menu-btn { position: absolute; left: 0; background: none; border: none; color: var(--text); font-size: 1.8rem; cursor: pointer; }

        .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; width: 100%; max-width: 450px; }
        .tab-btn { flex: 1; padding: 14px; border: none; border-radius: 14px; background: var(--card); color: #94a3b8; cursor: pointer; font-weight: bold; border: 1px solid var(--border); }
        .tab-btn.active { background: var(--accent); color: white; }

        .container { width: 100%; max-width: 450px; }
        .tool-section { display: none; }
        .tool-section.active { display: block; }
        .view { display: none; }
        .view.active { display: block; }

        .card { background: var(--card); padding: 25px; border-radius: 28px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 1px solid var(--border); text-align: center; margin-bottom: 15px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        label { font-size: 0.75rem; text-transform: uppercase; color: #64748b; margin-left: 5px; font-weight: bold; }
        select, input { width: 100%; padding: 16px; background: var(--input-bg); border: 2px solid var(--border); border-radius: 14px; color: var(--text); font-size: 1.1rem; margin-top: 5px; box-sizing: border-box; outline: none; }

        .search-box { margin-bottom: 15px; background: var(--input-bg); border: 2px solid var(--border); border-radius: 12px; padding: 12px; color: var(--text); width: 100%; box-sizing: border-box; }

        .result-container { margin-top: 10px; background: rgba(0,0,0,0.05); border-radius: 20px; padding: 25px; min-height: 140px; display: flex; flex-direction: column; justify-content: center; }
        .main-res { font-size: 3rem; font-weight: 800; color: var(--accent); line-height: 1; }
        .badge { display: inline-block; padding: 8px 16px; border-radius: 50px; font-weight: bold; font-size: 0.8rem; margin-top: 15px; text-transform: uppercase; }
        .badge-std { background: rgba(74, 222, 128, 0.2); color: var(--std); border: 1px solid var(--std); }
        .badge-spec { background: rgba(251, 191, 36, 0.2); color: var(--spec); border: 1px solid var(--spec); }

        .sidebar { position: fixed; left: -300px; top: 0; width: 300px; height: 100vh; background: var(--card); z-index: 1000; transition: 0.3s; padding: 25px; box-sizing: border-box; overflow-y: auto; }
        .sidebar.active { left: 0; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; }
        .overlay.active { display: block; }
        .menu-item { padding: 15px 10px; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
        .submenu { display: none; background: rgba(0,0,0,0.1); border-radius: 8px; margin-top: 5px; }
        .submenu.show { display: block; }
        .submenu-item { padding: 12px 20px; cursor: pointer; font-size: 0.9rem; color: #94a3b8; border-bottom: 1px solid var(--border); }

        .table-wrapper { max-height: 60vh; overflow-y: auto; border-radius: 12px; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
        th { background: var(--accent); color: white; padding: 12px 5px; position: sticky; top: 0; z-index: 10; }
        td { padding: 10px 5px; border-bottom: 1px solid var(--border); text-align: center; }
        tr:nth-child(even) { background: rgba(255,255,255,0.03); }
        .sticky-col { position: sticky; left: 0; background: var(--card); font-weight: bold; border-right: 2px solid var(--border); z-index: 5; }
    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
    
    <nav class="sidebar" id="sidebar">
        <h2 id="txt-menu-title" style="color: var(--accent); margin-bottom: 25px;">Menú</h2>
        <div class="menu-item" onclick="toggleFolder('folder-mm-in')"><span id="txt-menu-tool1">mm ⇄ pulgadas fracción</span><span>▾</span></div>
        <div id="folder-mm-in" class="submenu">
            <div class="submenu-item" onclick="loadTool('converter', 'calc')">➤ Calculadora</div>
            <div class="submenu-item" onclick="loadTool('converter', 'tables')">➤ Tablas</div>
        </div>
        <div class="menu-item" onclick="loadTool('steel', 'main')"><span>Calibre acero (mm - kg/m²)</span></div>
        <div class="menu-item" onclick="loadTool('wire', 'main')"><span>Comparativa Cables (AWG/BWG)</span></div>
        <div class="menu-item" onclick="toggleFolder('folder-config')"><span>⚙️ Ajustes</span><span>▾</span></div>
        <div id="folder-config" class="submenu">
            <div style="padding: 15px;">
                <select id="themeSelect" onchange="changeTheme()" style="width:100%; margin-bottom:10px;"><option value="dark">🌙 Dark</option><option value="light">☀️ Light</option></select>
                <select id="langSelect" onchange="changeLang()" style="width:100%;"><option value="es">Español</option><option value="en">English</option></select>
            </div>
        </div>
    </nav>

    <header class="top-header">
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <h2 id="main-title">Mecánico Pro ⚡</h2>
    </header>

    <div class="container">
        <section id="section-converter" class="tool-section active">
            <div class="nav-tabs">
                <button class="tab-btn active" id="tab-calc" onclick="switchSubView('calc')">Calculadora</button>
                <button class="tab-btn" id="tab-tables" onclick="switchSubView('tables')">Tablas</button>
            </div>
            <div id="subview-calc" class="view active">
                <div class="card">
                    <div class="input-group">
                        <label id="txt-label-mode">Modo</label>
                        <select id="mode" onchange="convert()"><option value="mm_to_in">Milímetros a Pulgadas</option><option value="in_to_mm">Pulgadas a Milímetros</option></select>
                    </div>
                    <div class="input-group">
                        <label id="txt-label-measure">Medida</label>
                        <input type="text" id="input" placeholder="Ej: 13 o 1 1/2" oninput="convert()">
                    </div>
                    <div class="result-container" id="resBox"></div>
                </div>
            </div>
            <div id="subview-tables" class="view">
                <div class="card" style="padding: 15px;">
                    <input type="text" id="tableSearch" class="search-box" placeholder="🔍 Buscar medida..." oninput="filterTable('tableBody', this.value)">
                    <div class="table-wrapper">
                        <table>
                            <thead><tr><th>Fracción</th><th>mm</th><th>Decimal</th></tr></thead>
                            <tbody id="tableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>

        <section id="section-steel" class="tool-section">
            <div class="card" style="padding: 10px;">
                <h3 style="margin-bottom:15px;">Tabla de Calibres (Acero)</h3>
                <div class="table-wrapper">
                    <table>
                        <thead><tr><th>Calibre</th><th>mm</th><th>pulg</th><th>kg/m²</th></tr></thead>
                        <tbody id="steelTableBody"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <section id="section-wire" class="tool-section">
            <div class="card" style="padding: 10px;">
                <h3 style="margin-bottom:15px; font-size: 0.9rem; color: var(--accent);">TABLA COMPARATIVA DE CABLES</h3>
                <div class="table-wrapper">
                    <table style="font-size: 0.6rem;">
                        <thead>
                            <tr><th rowspan="2" class="sticky-col">CAL.</th><th colspan="2">B.W.G.</th><th colspan="2">A.W.G.</th><th colspan="2">U.S. STD.</th><th colspan="2">S.W.G.</th></tr>
                            <tr><th>mm</th><th>pulg</th><th>mm</th><th>pulg</th><th>mm</th><th>pulg</th><th>mm</th><th>pulg</th></tr>
                        </thead>
                        <tbody id="wireTableBody"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>

<script>
    const translations = {
        es: { title: "Mecánico Pro ⚡", menu: "Menú", tool1: "mm ⇄ pulgadas fracción", prompt: "Introduce medida...", std: "✓ LLAVE ESTÁNDAR", spec: "LLAVE ESPECIAL" },
        en: { title: "Mechanic Pro ⚡", menu: "Menu", tool1: "mm ⇄ fraction inches", prompt: "Enter value...", std: "✓ STANDARD WRENCH", spec: "SPECIAL WRENCH" }
    };

    // MAPA COMERCIAL: Corregido para forzar 13mm -> 1/2" y 25mm -> 1"
    const commercialMap = {
        "10": "3/8\"", "11": "7/16\"", "13": "1/2\"", "14": "9/16\"", "16": "5/8\"", 
        "17": "11/16\"", "19": "3/4\"", "22": "7/8\"", "24": "15/16\"", "25": "1\"", "25.4": "1\""
    };

    const steelData = [
        ["1/2\"","12.70","0.500","99.6"], ["3/8\"","9.52","0.375","74.8"], ["1/4\"","6.35","0.250","49.8"], ["10","3.41","0.134","26.8"], ["12","2.65","0.104","20.8"], ["14","1.89","0.074","14.9"], ["16","1.51","0.059","11.9"], ["18","1.21","0.047","9.5"], ["20","0.91","0.035","7.1"]
    ];

    const wireData = [
        ["7/0", "-", "-", "-", "-", "12.451", "0.490", "12.700", "0.500"],
        ["1/0", "8.636", "0.340", "8.252", "0.325", "7.783", "0.308", "8.230", "0.324"],
        ["1", "7.620", "0.300", "7.384", "0.284", "7.003", "0.276", "7.620", "0.300"],
        ["10", "3.404", "0.134", "2.588", "0.102", "3.503", "0.138", "3.251", "0.128"],
        ["12", "2.769", "0.109", "2.052", "0.081", "2.723", "0.107", "2.642", "0.104"],
        ["14", "2.108", "0.083", "1.628", "0.064", "1.946", "0.077", "2.032", "0.080"],
        ["20", "0.889", "0.035", "0.813", "0.032", "0.835", "0.037", "0.814", "0.038"]
    ];

    function init() {
        const sysLang = navigator.language.startsWith('es') ? 'es' : 'en';
        document.getElementById('langSelect').value = localStorage.getItem('lang') || sysLang;
        
        document.getElementById('steelTableBody').innerHTML = steelData.map(r => `<tr><td style="font-weight:bold">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('');
        document.getElementById('wireTableBody').innerHTML = wireData.map(r => `<tr><td class="sticky-col">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td>${r[5]}</td><td>${r[6]}</td><td>${r[7]}</td><td>${r[8]}</td></tr>`).join('');

        const tableBody = document.getElementById('tableBody');
        const gcd = (a, b) => b ? gcd(b, a % b) : a;
        let html = '';
        for (let i = 1; i <= 64; i++) {
            const d = i / 64; const c = gcd(i, 64);
            html += `<tr><td>${i/c}/${64/c}"</td><td>${(d*25.4).toFixed(2)}</td><td>${d.toFixed(3)}</td></tr>`;
        }
        tableBody.innerHTML = html;
        changeLang();
    }

    function convert() {
        const raw = document.getElementById('input').value.trim();
        const mode = document.getElementById('mode').value;
        const resBox = document.getElementById('resBox');
        const lang = document.getElementById('langSelect').value;
        if (!raw) { resBox.innerHTML = `<div style="color:#64748b">${translations[lang].prompt}</div>`; return; }
        
        let val = evalFrac(raw);
        if (mode === 'mm_to_in') {
            // Prioridad al mapa comercial
            let isStd = !!commercialMap[Math.round(val).toString()] || !!commercialMap[val.toString()];
            let frac = commercialMap[Math.round(val).toString()] || toFrac(val / 25.4);
            resBox.innerHTML = `<div class="main-res">${frac}</div><div class="badge ${isStd?'badge-std':'badge-spec'}">${isStd?translations[lang].std:translations[lang].spec}</div>`;
        } else {
            let mm = val * 25.4;
            resBox.innerHTML = `<div class="main-res">${mm.toFixed(2)}<small style="font-size:1.5rem">mm</small></div>`;
        }
    }

    function toFrac(dec) {
        const d = 64; let n = Math.round(dec * d); const e = Math.floor(n / d); n = n % d;
        if (n === 0) return e + '"';
        const gcd = (a, b) => b ? gcd(b, a % b) : a;
        const c = gcd(n, d);
        return (e > 0 ? e + " " : "") + (n/c) + "/" + (d/c) + '"';
    }

    function evalFrac(t) {
        t = t.replace(',', '.');
        if (t.includes('/')) {
            const parts = t.split(/\s+/);
            if (parts.length > 1) {
                const f = parts[1].split('/');
                return parseFloat(parts[0]) + (parseFloat(f[0])/parseFloat(f[1]));
            }
            const f = t.split('/'); return parseFloat(f[0])/parseFloat(f[1]);
        }
        return parseFloat(t);
    }

    function filterTable(id, val) {
        const rows = document.getElementById(id).getElementsByTagName('tr');
        val = val.toLowerCase();
        for (let row of rows) { row.style.display = row.innerText.toLowerCase().includes(val) ? '' : 'none'; }
    }

    function changeLang() {
        const lang = document.getElementById('langSelect').value;
        localStorage.setItem('lang', lang);
        document.getElementById('main-title').innerText = translations[lang].title;
        document.getElementById('txt-menu-title').innerText = translations[lang].menu;
        document.getElementById('txt-menu-tool1').innerText = translations[lang].tool1;
        convert();
    }

    function loadTool(t, s) { 
        document.querySelectorAll('.tool-section').forEach(x => x.classList.remove('active'));
        document.getElementById('section-'+t).classList.add('active');
        if(t==='converter') switchSubView(s);
        toggleMenu();
    }

    function switchSubView(v) {
        document.querySelectorAll('.view').forEach(x => x.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('active'));
        document.getElementById('subview-'+v).classList.add('active');
        document.getElementById('tab-'+v).classList.add('active');
    }

    function toggleMenu() { document.getElementById('sidebar').classList.toggle('active'); document.getElementById('overlay').classList.toggle('active'); }
    function toggleFolder(id) { document.getElementById(id).classList.toggle('show'); }
    function changeTheme() { document.body.classList.toggle('light-mode', document.getElementById('themeSelect').value === 'light'); }

    init();
</script>
</body>
</html>
