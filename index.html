<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mecánico Pro ⚡</title>
    <style>
        :root { 
            --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #f1f5f9; 
            --std: #4ade80; --spec: #fbbf24; --input-bg: #1e293b; --border: rgba(255,255,255,0.1);
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }

        /* HEADER Y MENÚ */
        .top-header { width: 100%; padding: 15px 20px; display: flex; align-items: center; background: #0f172a; position: sticky; top: 0; z-index: 100; }
        .menu-btn { background: none; border: none; color: white; font-size: 1.8rem; cursor: pointer; margin-right: 15px; }
        .top-header h2 { margin: 0; color: var(--accent); font-size: 1.4rem; }

        /* SIDEBAR */
        .sidebar { position: fixed; left: -300px; top: 0; width: 280px; height: 100vh; background: var(--card); z-index: 1001; transition: 0.3s; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .sidebar.active { left: 0; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; }
        .overlay.active { display: block; }
        .menu-section { margin-bottom: 25px; }
        .menu-title { font-size: 0.75rem; color: #64748b; text-transform: uppercase; font-weight: bold; border-bottom: 1px solid var(--border); padding-bottom: 5px; margin-bottom: 10px; }
        .menu-item { padding: 12px 10px; cursor: pointer; border-radius: 8px; font-size: 0.95rem; }
        .menu-item.active { background: var(--accent); color: white; }

        /* CONTENIDO */
        .container { width: 100%; max-width: 500px; margin: auto; padding: 20px; box-sizing: border-box; }
        .card { background: var(--card); padding: 25px; border-radius: 24px; border: 1px solid var(--border); margin-bottom: 20px; }
        
        /* INPUT CON BOTONES INTEGRADOS (Como en la foto) */
        .input-wrapper { position: relative; margin-top: 5px; display: flex; align-items: center; }
        input { width: 100%; padding: 18px 90px 18px 15px; background: #151f32; border: 2px solid var(--border); border-radius: 14px; color: white; font-size: 1.1rem; outline: none; }
        .input-btns { position: absolute; right: 8px; display: flex; gap: 5px; }
        .q-btn { background: var(--accent); color: white; border: none; width: 38px; height: 38px; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        label { display: block; font-size: 0.75rem; color: #64748b; margin: 15px 0 5px 5px; text-transform: uppercase; font-weight: bold; }
        select { width: 100%; padding: 15px; background: #151f32; border: 2px solid var(--border); border-radius: 14px; color: white; font-size: 1rem; outline: none; }

        .result-box { margin-top: 20px; text-align: center; min-height: 120px; display: flex; flex-direction: column; justify-content: center; }
        .res-main { font-size: 3.5rem; font-weight: 800; color: var(--accent); line-height: 1; }
        .suggestion-badge { background: rgba(74, 222, 128, 0.1); color: var(--std); border: 1px solid var(--std); padding: 8px 15px; border-radius: 50px; display: inline-block; margin-top: 15px; font-size: 0.8rem; font-weight: bold; }

        /* TABLAS */
        .table-wrap { max-height: 65vh; overflow-y: auto; border: 1px solid var(--border); border-radius: 12px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        th { background: #1e293b; color: var(--accent); padding: 12px 5px; position: sticky; top: 0; z-index: 10; border-bottom: 2px solid var(--border); }
        td { padding: 10px 5px; border-bottom: 1px solid var(--border); text-align: center; }
        .sticky-col { position: sticky; left: 0; background: #1e293b; font-weight: bold; border-right: 2px solid var(--border); }

        .view-section { display: none; }
        .view-section.active { display: block; }
    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
    
    <nav class="sidebar" id="sidebar">
        <div class="menu-section">
            <div class="menu-title">mm ⇄ pulgadas fracción</div>
            <div class="menu-item active" onclick="showView('calc')">Calculadora</div>
            <div class="menu-item" onclick="showView('table-equiv')">Tablas de equivalencias</div>
        </div>
        <div class="menu-section">
            <div class="menu-title">Acero</div>
            <div class="menu-item" onclick="showView('steel')">Calibre acero (mm - mil pulg)</div>
        </div>
        <div class="menu-section">
            <div class="menu-title">Cables</div>
            <div class="menu-item" onclick="showView('wire')">Comparativa de Calibres</div>
        </div>
    </nav>

    <header class="top-header">
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <h2 id="view-title">Calculadora</h2>
    </header>

    <div class="container">
        
        <div id="view-calc" class="view-section active">
            <div class="card">
                <label>Modo</label>
                <select id="mode" onchange="updateUI()">
                    <option value="mm_to_in">Milímetros a Pulgadas</option>
                    <option value="in_to_mm">Pulgadas a Milímetros</option>
                </select>
                
                <label>Medida</label>
                <div class="input-wrapper">
                    <input type="text" id="input" placeholder="Ej: 13 o 1 1/2" oninput="calculate()">
                    <div class="input-btns" id="frac-btns" style="display:none;">
                        <button class="q-btn" onclick="addChar(' ')">␣</button>
                        <button class="q-btn" onclick="addChar('/')">/</button>
                    </div>
                </div>

                <div class="result-box">
                    <div class="res-main" id="res-val">---</div>
                    <div id="res-extra"></div>
                </div>
            </div>
        </div>

        <div id="view-table-equiv" class="view-section">
            <div class="card" style="padding: 10px;">
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>Fracción</th><th>mm</th><th>Decimal</th></tr></thead>
                        <tbody id="equivBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="view-steel" class="view-section">
            <div class="card" style="padding: 10px;">
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>Calibre No.</th><th>mm</th><th>pulg</th><th>kg/m²</th></tr></thead>
                        <tbody id="steelBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="view-wire" class="view-section">
            <div class="card" style="padding: 10px;">
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th rowspan="2" class="sticky-col">CAL</th>
                                <th colspan="2">B.W.G.</th><th colspan="2">A.W.G.</th><th colspan="2">U.S. STD.</th>
                            </tr>
                            <tr>
                                <th>mm</th><th>pulg</th><th>mm</th><th>pulg</th><th>mm</th><th>pulg</th>
                            </tr>
                        </thead>
                        <tbody id="wireBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

<script>
    // DATA COMPLETA DE ACERO (image_999cc3.png)
    const steelData = [
        ["1/2\"", "12.70", "0.500", "99.695"], ["7/16\"", "11.11", "0.438", "87.214"], ["3/8\"", "9.53", "0.375", "74.811"], ["5/16\"", "7.94", "0.313", "62.329"], ["1/4\"", "6.35", "0.250", "49.848"],
        ["3", "6.07", "0.239", "47.650"], ["4", "5.69", "0.224", "44.667"], ["5", "5.31", "0.209", "41.684"], ["6", "4.94", "0.194", "38.779"], ["3/16\"", "4.76", "0.188", "37.366"],
        ["7", "4.55", "0.179", "35.718"], ["8", "4.18", "0.164", "32.813"], ["9", "3.80", "0.150", "29.830"], ["10", "3.42", "0.135", "26.847"], ["1/8\"", "3.18", "0.125", "24.963"],
        ["11", "3.04", "0.120", "23.864"], ["12", "2.66", "0.105", "20.881"], ["13", "2.28", "0.090", "17.898"], ["14", "1.90", "0.075", "14.915"], ["15", "1.71", "0.067", "13.424"],
        ["1/16\"", "1.59", "0.063", "12.482"], ["16", "1.52", "0.060", "11.932"], ["17", "1.37", "0.054", "10.755"], ["18", "1.21", "0.048", "9.499"], ["19", "1.06", "0.042", "8.321"],
        ["20", "0.91", "0.036", "7.144"], ["21", "0.84", "0.033", "6.594"], ["1/32\"", "0.79", "0.031", "6.202"], ["22", "0.76", "0.030", "5.966"], ["23", "0.68", "0.027", "5.338"],
        ["24", "0.61", "0.024", "4.789"], ["25", "0.53", "0.021", "4.161"], ["26", "0.45", "0.018", "3.533"], ["27", "0.42", "0.016", "3.297"], ["1/64\"", "0.40", "0.016", "3.140"],
        ["28", "0.38", "0.015", "2.983"], ["29", "0.34", "0.014", "2.669"], ["30", "0.30", "0.012", "2.355"], ["31", "0.27", "0.011", "2.120"], ["32", "0.25", "0.010", "1.963"],
        ["33", "0.23", "0.009", "1.806"], ["34", "0.21", "0.008", "1.649"]
    ];

    // DATA CABLES (image_9a675d.png)
    const wireData = [
        ["7/0","-","-","-","-","12.451","0.490"], ["6/0","-","-","14.732","0.580","11.674","0.460"], ["5/0","12.7","0.500","13.119","0.519","10.894","0.429"],
        ["4/0","11.532","0.454","11.684","0.460","10.117","0.398"], ["3/0","10.795","0.425","10.04","0.410","9.337","0.368"], ["2/0","9.652","0.380","9.266","0.365","8.56","0.337"],
        ["1/0","8.636","0.340","8.252","0.325","7.783","0.308"], ["1","7.62","0.300","7.384","0.284","7.003","0.276"], ["2","7.214","0.284","6.543","0.258","6.614","0.260"],
        ["4","6.045","0.238","5.181","0.204","5.837","0.230"], ["6","5.156","0.203","4.115","0.152","5.057","0.199"], ["8","4.191","0.165","3.264","0.129","4.28","0.164"],
        ["10","3.404","0.134","2.588","0.102","3.503","0.138"], ["12","2.769","0.109","2.052","0.081","2.723","0.107"], ["14","2.108","0.083","1.628","0.064","1.946","0.077"],
        ["16","1.651","0.065","1.29","0.051","1.557","0.061"], ["18","1.245","0.049","1.024","0.040","1.245","0.049"], ["20","0.889","0.035","0.813","0.032","0.835","0.037"]
    ];

    function init() {
        const sBody = document.getElementById('steelBody');
        steelData.forEach(r => { sBody.innerHTML += `<tr><td class="sticky-col">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`; });

        const wBody = document.getElementById('wireBody');
        wireData.forEach(r => { wBody.innerHTML += `<tr><td class="sticky-col">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td>${r[5]}</td><td>${r[6]}</td></tr>`; });

        const eBody = document.getElementById('equivBody');
        const gcd = (a, b) => b ? gcd(b, a % b) : a;
        for (let i = 1; i <= 64; i++) {
            let c = gcd(i, 64);
            let frac = (i/c) + "/" + (64/c) + '"';
            if (i === 64) frac = '1"';
            let d = i/64;
            eBody.innerHTML += `<tr><td>${frac}</td><td>${(d*25.4).toFixed(2)}</td><td>${d.toFixed(3)}</td></tr>`;
        }
        calculate();
    }

    function addChar(c) { const i = document.getElementById('input'); i.value += c; i.focus(); calculate(); }

    function toggleMenu() { document.getElementById('sidebar').classList.toggle('active'); document.getElementById('overlay').classList.toggle('active'); }

    function showView(id) {
        document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
        document.getElementById('view-' + id).classList.add('active');
        document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
        event.currentTarget.classList.add('active');
        const titles = { 'calc': 'Calculadora', 'table-equiv': 'Equivalencias', 'steel': 'Calibre Acero', 'wire': 'Cables' };
        document.getElementById('view-title').innerText = titles[id];
        toggleMenu();
    }

    function updateUI() {
        const m = document.getElementById('mode').value;
        document.getElementById('frac-btns').style.display = (m === 'in_to_mm') ? 'flex' : 'none';
        calculate();
    }

    function calculate() {
        const mode = document.getElementById('mode').value;
        const val = document.getElementById('input').value;
        const resV = document.getElementById('res-val');
        const resE = document.getElementById('res-extra');

        if (!val) { resV.innerText = "---"; resE.innerHTML = ""; return; }

        if (mode === 'mm_to_in') {
            let mm = parseFloat(val.replace(',', '.'));
            if (Math.round(mm) === 13) {
                resV.innerText = '1/2"';
                resE.innerHTML = `<div class="suggestion-badge">✓ LLAVE ESTÁNDAR: 13MM</div>`;
            } else if (Math.round(mm) === 25) {
                resV.innerText = '1"';
                resE.innerHTML = `<div class="suggestion-badge">✓ LLAVE ESTÁNDAR: 25MM</div>`;
            } else {
                let d = mm / 25.4;
                resV.innerText = toFrac(d);
                resE.innerText = `Decimal: ${d.toFixed(3)}"`;
            }
        } else {
            let mm = parseIn(val) * 25.4;
            resV.innerText = mm.toFixed(2) + " mm";
            resE.innerHTML = `<div class="suggestion-badge">SUGERENCIA: ${Math.round(mm)}MM</div>`;
        }
    }

    function toFrac(dec) {
        let d = 64; let n = Math.round(dec * d);
        if (n === 0) return '0"';
        const gcd = (a, b) => b ? gcd(b, a % b) : a;
        let c = gcd(n, d);
        return (n/c) + "/" + (d/c) + '"';
    }

    function parseIn(s) {
        if (!s.includes('/') && !s.includes(' ')) return parseFloat(s);
        let p = s.trim().split(' ');
        if (p.length === 2) {
            let f = p[1].split('/');
            return parseFloat(p[0]) + (parseFloat(f[0])/parseFloat(f[1]));
        }
        let f = p[0].split('/'); return parseFloat(f[0])/parseFloat(f[1]);
    }

    init();
</script>
</body>
</html>
