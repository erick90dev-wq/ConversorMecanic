<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mecánico Pro ⚡</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #f1f5f9; --std: #4ade80; --spec: #fbbf24; }
        
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 1. TÍTULO SUPERIOR (RECTÁNGULO ROJO) */
        .top-header {
            width: 100%;
            max-width: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px 0;
        }

        .top-header h2 {
            margin: 0;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.8rem;
        }

        /* 2. BOTÓN DE MENÚ (RECTÁNGULO AMARILLO) */
        .menu-btn {
            position: absolute;
            left: 0;
            background: none;
            border: none;
            color: var(--text);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 5px;
        }

        /* 3. PESTAÑAS (RECTÁNGULO VERDE) - AHORA EN LA POSICIÓN DEL ROJO */
        .nav-tabs { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 20px; 
            width: 100%; 
            max-width: 450px; 
        }

        .tab-btn { 
            flex: 1; 
            padding: 12px; 
            border: none; 
            border-radius: 12px; 
            background: #1e293b; 
            color: #94a3b8; 
            cursor: pointer; 
            font-weight: bold; 
            border: 1px solid rgba(255,255,255,0.05); 
        }

        .tab-btn.active { 
            background: var(--accent); 
            color: var(--bg); 
        }

        /* CONTENEDOR Y VISTAS */
        .container { width: 100%; max-width: 450px; }
        .view { display: none; }
        .view.active { display: block; }

        .card { 
            background: var(--card); 
            padding: 25px; 
            border-radius: 28px; 
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); 
            border: 1px solid rgba(255,255,255,0.05); 
            text-align: center;
        }

        .input-group { margin-bottom: 20px; text-align: left; }
        label { font-size: 0.75rem; text-transform: uppercase; color: #94a3b8; margin-left: 5px; }
        select, input { width: 100%; padding: 16px; background: #0f172a; border: 2px solid #334155; border-radius: 14px; color: white; font-size: 1.1rem; margin-top: 5px; box-sizing: border-box; outline: none; }

        .result-container { margin-top: 10px; background: rgba(15, 23, 42, 0.6); border-radius: 20px; padding: 25px; border: 1px solid #334155; min-height: 140px; display: flex; flex-direction: column; justify-content: center; }
        .main-res { font-size: 3rem; font-weight: 800; color: var(--accent); line-height: 1; }
        .badge { display: inline-block; padding: 6px 16px; border-radius: 50px; font-weight: bold; font-size: 0.8rem; margin-top: 15px; text-transform: uppercase; }
        .badge-std { background: rgba(74, 222, 128, 0.2); color: var(--std); border: 1px solid var(--std); }
        .badge-spec { background: rgba(251, 191, 36, 0.2); color: var(--spec); border: 1px solid var(--spec); }

        /* TABLAS */
        .table-card { background: var(--card); border-radius: 24px; padding: 15px; }
        .table-wrapper { max-height: 60vh; overflow-y: auto; border-radius: 12px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th { background: #334155; color: var(--accent); padding: 12px; text-align: left; position: sticky; top: 0; }
        td { padding: 10px; border-bottom: 1px solid #334155; }
        
        /* MENU LATERAL (SIDEBAR) */
        .sidebar {
            position: fixed; left: -280px; top: 0; width: 280px; height: 100vh;
            background: var(--card); z-index: 1000; transition: 0.3s; padding: 20px;
            box-sizing: border-box; border-right: 1px solid rgba(255,255,255,0.1);
        }
        .sidebar.active { left: 0; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 999; }
        .overlay.active { display: block; }
    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
    <nav class="sidebar" id="sidebar">
        <h3 style="color: var(--accent)">Opciones</h3>
        <div style="padding: 15px 0; cursor: pointer;" onclick="showConfig()">⚙️ Configuración</div>
        <div style="padding: 15px 0; cursor: pointer;" onclick="alert('Muy pronto...')">☕ Donaciones</div>
    </nav>

    <header class="top-header">
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <h2>Mecánico Pro ⚡</h2>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" id="btn-calc" onclick="switchView('calc')">Calculadora</button>
        <button class="tab-btn" id="btn-tables" onclick="switchView('tables')">Tablas</button>
    </div>

    <div class="container">
        <div id="calcView" class="view active">
            <div class="card">
                <div class="input-group">
                    <label>Modo</label>
                    <select id="mode" onchange="convert()">
                        <option value="mm_to_in">Milímetros a Pulgadas</option>
                        <option value="in_to_mm">Pulgadas a Milímetros</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Medida</label>
                    <input type="text" id="input" inputmode="decimal" placeholder="Ej: 13 o 1 1/2" oninput="convert()">
                </div>
                <div class="result-container" id="resBox">
                    <div style="color: #475569;">Introduce una medida...</div>
                </div>
            </div>
        </div>

        <div id="tablesView" class="view">
            <div class="table-card">
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr><th>Fracción</th><th>mm</th><th>Decimal</th></tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

<script>
    const tablaComercial = {"1.5": "1/16\"", "2": "5/64\"", "2.5": "3/32\"", "3": "1/8\"", "4": "5/32\"", "5": "3/16\"", "5.5": "7/32\"", "6": "1/4\"", "8": "5/16\"", "10": "3/8\"", "11": "7/16\"", "12": "15/32\"", "13": "1/2\"", "14": "9/16\"", "15": "19/32\"", "16": "5/8\"", "17": "11/16\"", "19": "3/4\"", "22": "7/8\"", "24": "15/16\"", "25": "1\"", "25.4": "1\""};

    function toggleMenu() {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('overlay').classList.toggle('active');
    }

    function switchView(view) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(view + 'View').classList.add('active');
        if(view === 'calc') document.getElementById('btn-calc').classList.add('active');
        else document.getElementById('btn-tables').classList.add('active');
    }

    // Lógica de conversión (del checkpoint)
    function convert() {
        const rawVal = document.getElementById('input').value.trim();
        const mode = document.getElementById('mode').value;
        const resBox = document.getElementById('resBox');
        if (!rawVal) { resBox.innerHTML = '<div style="color: #475569;">Introduce una medida...</div>'; return; }
        
        const val = procesarEntrada(rawVal);
        if (isNaN(val)) return;

        if (mode === 'mm_to_in') {
            let res = tablaComercial[val] || toFraction(val / 25.4);
            let isStd = !!tablaComercial[val];
            resBox.innerHTML = `<div class="main-res">${res}</div><div class="badge ${isStd ? 'badge-std' : 'badge-spec'}">${isStd ? '✓ Llave Estándar' : 'Llave Especial'}</div>`;
        } else {
            const mm = val * 25.4;
            resBox.innerHTML = `<div class="main-res">${mm.toFixed(2)}<small style="font-size:1.5rem">mm</small></div><div class="badge badge-std">Sugerencia: ${Math.round(mm)}mm</div>`;
        }
    }

    function procesarEntrada(texto) {
        texto = texto.replace(',', '.').replace('-', ' ').trim();
        if (texto.includes(' ')) {
            const partes = texto.split(/\s+/);
            const f = partes[1].split('/');
            return parseFloat(partes[0]) + (parseFloat(f[0]) / parseFloat(f[1]));
        } else if (texto.includes('/')) {
            const f = texto.split('/');
            return parseFloat(f[0]) / parseFloat(f[1]);
        }
        return parseFloat(texto);
    }

    function toFraction(dec) {
        const d = 64;
        let n = Math.round(dec * d);
        const entero = Math.floor(n / d);
        n = n % d;
        if (n === 0) return entero + '"';
        const gcd = (a, b) => b ? gcd(b, a % b) : a;
        const common = gcd(n, d);
        return (entero > 0 ? entero + " " : "") + (n/common) + "/" + (d/common) + '"';
    }

    // Generar tabla
    const tableBody = document.getElementById('tableBody');
    let tableHTML = '';
    for (let i = 1; i <= 64; i++) {
        const dec = i / 64;
        const mm = dec * 25.4;
        tableHTML += `<tr><td>${i}/64"</td><td>${mm.toFixed(2)}</td><td>${dec.toFixed(3)}</td></tr>`;
    }
    tableBody.innerHTML = tableHTML;
</script>
</body>
</html>
