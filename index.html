<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mecánico Pro ⚡</title>
    <style>
        :root { 
            --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #f1f5f9; 
            --std: #4ade80; --spec: #fbbf24; --input-bg: #0f172a; --border: rgba(255,255,255,0.1);
        }
        
        .light-mode {
            --bg: #f1f5f9; --card: #ffffff; --accent: #0284c7; --text: #1e293b;
            --std: #16a34a; --spec: #d97706; --input-bg: #f8fafc; --border: rgba(0,0,0,0.1);
        }

        body { 
            font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); 
            margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center;
            transition: 0.3s;
        }

        .top-header { width: 100%; max-width: 450px; display: flex; align-items: center; justify-content: center; position: relative; padding: 15px 0; }
        .top-header h2 { margin: 0; background: linear-gradient(to right, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 1.8rem; }
        .menu-btn { position: absolute; left: 0; background: none; border: none; color: var(--text); font-size: 1.8rem; cursor: pointer; }

        .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; width: 100%; max-width: 450px; }
        .tab-btn { flex: 1; padding: 14px; border: none; border-radius: 14px; background: var(--card); color: #94a3b8; cursor: pointer; font-weight: bold; border: 1px solid var(--border); }
        .tab-btn.active { background: var(--accent); color: white; }

        .container { width: 100%; max-width: 450px; }
        .tool-section { display: none; }
        .tool-section.active { display: block; }
        .view { display: none; }
        .view.active { display: block; }

        .card { background: var(--card); padding: 25px; border-radius: 28px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 1px solid var(--border); text-align: center; }
        .input-group { margin-bottom: 20px; text-align: left; position: relative; }
        label { font-size: 0.75rem; text-transform: uppercase; color: #64748b; margin-left: 5px; font-weight: bold; }
        select, input { width: 100%; padding: 16px; background: var(--input-bg); border: 2px solid var(--border); border-radius: 14px; color: var(--text); font-size: 1.1rem; margin-top: 5px; box-sizing: border-box; outline: none; }

        .helper-btns { display: none; position: absolute; right: 8px; bottom: 6px; gap: 5px; z-index: 5; }
        .tool-btn { background: var(--accent); color: white; border: none; border-radius: 10px; width: 44px; height: 44px; font-size: 1.2rem; cursor: pointer; }

        .result-container { margin-top: 10px; background: rgba(0,0,0,0.05); border-radius: 20px; padding: 25px; min-height: 140px; display: flex; flex-direction: column; justify-content: center; }
        .main-res { font-size: 3rem; font-weight: 800; color: var(--accent); line-height: 1; }
        .badge { display: inline-block; padding: 6px 16px; border-radius: 50px; font-weight: bold; font-size: 0.8rem; margin-top: 15px; text-transform: uppercase; }
        .badge-std { background: rgba(74, 222, 128, 0.2); color: var(--std); border: 1px solid var(--std); }
        .badge-spec { background: rgba(251, 191, 36, 0.2); color: var(--spec); border: 1px solid var(--spec); }

        .sidebar { position: fixed; left: -300px; top: 0; width: 300px; height: 100vh; background: var(--card); z-index: 1000; transition: 0.3s; padding: 25px; box-sizing: border-box; box-shadow: 10px 0 30px rgba(0,0,0,0.2); }
        .sidebar.active { left: 0; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; }
        .overlay.active { display: block; }
        
        .menu-item { padding: 15px 10px; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; justify-content: space-between; font-weight: 500; }
        .submenu { display: none; background: rgba(0,0,0,0.1); border-radius: 8px; margin-top: 5px; }
        .submenu.show { display: block; }
        .submenu-item { padding: 12px 20px; cursor: pointer; font-size: 0.9rem; color: #94a3b8; }

        .table-wrapper { max-height: 55vh; overflow-y: auto; border-radius: 12px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th { background: var(--accent); color: white; padding: 12px; position: sticky; top: 0; }
        td { padding: 10px; border-bottom: 1px solid var(--border); }
    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
    
    <nav class="sidebar" id="sidebar">
        <h2 id="txt-menu-title" style="color: var(--accent); margin-bottom: 25px;">Menú</h2>
        
        <div class="menu-item" onclick="toggleFolder('folder-mm-in')">
            <span id="txt-menu-tool1">mm ⇄ pulgadas fracción</span>
            <span>▾</span>
        </div>
        <div id="folder-mm-in" class="submenu show">
            <div class="submenu-item" onclick="loadTool('converter', 'calc')" id="txt-sub-calc">➤ Calculadora</div>
            <div class="submenu-item" onclick="loadTool('converter', 'tables')" id="txt-sub-tables">➤ Tablas de equivalencia</div>
        </div>

        <div class="menu-item" onclick="loadTool('steel', 'main')">
            <span id="txt-menu-steel">Calibre acero (mm - mil pulg)</span>
        </div>
        
        <div class="menu-item" onclick="toggleFolder('folder-config')">
            <span id="txt-menu-config">⚙️ Ajustes</span>
            <span>▾</span>
        </div>
        <div id="folder-config" class="submenu">
            <div style="padding: 15px;">
                <label id="txt-label-theme">Apariencia</label>
                <select id="themeSelect" onchange="changeTheme()" style="width:100%; margin-bottom:10px;">
                    <option value="dark">🌙 Dark</option>
                    <option value="light">☀️ Light</option>
                </select>
                <label id="txt-label-lang">Idioma</label>
                <select id="langSelect" onchange="changeLang()" style="width:100%;">
                    <option value="es">Español</option>
                    <option value="en">English</option>
                    <option value="fr">Français</option>
                    <option value="de">Deutsch</option>
                </select>
            </div>
        </div>
    </nav>

    <header class="top-header">
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <h2 id="main-title">Mecánico Pro ⚡</h2>
    </header>

    <div class="container">
        <section id="section-converter" class="tool-section active">
            <div class="nav-tabs">
                <button class="tab-btn active" id="tab-calc" onclick="switchSubView('calc')">Calculadora</button>
                <button class="tab-btn" id="tab-tables" onclick="switchSubView('tables')">Tablas</button>
            </div>

            <div id="subview-calc" class="view active">
                <div class="card">
                    <div class="input-group">
                        <label id="txt-label-mode">Modo</label>
                        <select id="mode" onchange="toggleMode()">
                            <option value="mm_to_in" id="opt-mm-in">Milímetros a Pulgadas</option>
                            <option value="in_to_mm" id="opt-in-mm">Pulgadas a Milímetros</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label id="txt-label-measure">Medida</label>
                        <input type="text" id="input" inputmode="decimal" placeholder="Ej: 13 o 1 1/2" oninput="convert()">
                        <div id="helperBtns" class="helper-btns">
                            <button class="tool-btn" onclick="addChar(' ')">␣</button>
                            <button class="tool-btn" onclick="addChar('/')">/</button>
                        </div>
                    </div>
                    <div class="result-container" id="resBox">
                        <div id="txt-prompt" style="color: #64748b;">Introduce una medida...</div>
                    </div>
                </div>
            </div>

            <div id="subview-tables" class="view">
                <div class="card" style="padding: 15px;">
                    <input type="text" id="tableSearch" placeholder="🔍 Buscar..." oninput="filterTable()" style="width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text);">
                    <div class="table-wrapper">
                        <table>
                            <thead><tr><th id="th-frac">Fracción</th><th>mm</th><th id="th-dec">Decimal</th></tr></thead>
                            <tbody id="tableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>

        <section id="section-steel" class="tool-section">
            <div class="card">
                <h3 id="txt-steel-title">Calibre de Acero</h3>
                <p id="txt-steel-placeholder" style="color: #64748b;">Próximamente contenido.</p>
            </div>
        </section>
    </div>

<script>
    const translations = {
        es: { title: "Mecánico Pro ⚡", menu: "Menú", tool1: "mm ⇄ pulgadas fracción", subCalc: "➤ Calculadora", subTables: "➤ Tablas de equivalencia", steel: "Calibre acero (mm - mil pulg)", config: "⚙️ Ajustes", theme: "Apariencia", lang: "Idioma", calcTab: "Calculadora", tableTab: "Tablas", mode: "Modo", measure: "Medida", prompt: "Introduce una medida...", mmIn: "Milímetros a Pulgadas", inMm: "Pulgadas a Milímetros", std: "✓ Llave Estándar", spec: "Llave Especial", sugg: "Sugerencia:", thFrac: "Fracción", thDec: "Decimal" },
        en: { title: "Mechanic Pro ⚡", menu: "Menu", tool1: "mm ⇄ fraction inches", subCalc: "➤ Calculator", subTables: "➤ Equivalence Charts", steel: "Steel Gauge (mm - mil inch)", config: "⚙️ Settings", theme: "Appearance", lang: "Language", calcTab: "Calculator", tableTab: "Charts", mode: "Mode", measure: "Size", prompt: "Enter measurement...", mmIn: "MM to Inches", inMm: "Inches to MM", std: "✓ Standard Wrench", spec: "Special Wrench", sugg: "Suggestion:", thFrac: "Fraction", thDec: "Decimal" },
        fr: { title: "Mécanicien Pro ⚡", menu: "Menu", tool1: "mm ⇄ pouces fraction", subCalc: "➤ Calculatrice", subTables: "➤ Tableaux d'équivalence", steel: "Jauge d'acier (mm - mil)", config: "⚙️ Réglages", theme: "Apparence", lang: "Langue", calcTab: "Calculatrice", tableTab: "Tableaux", mode: "Mode", measure: "Mesure", prompt: "Entrez la mesure...", mmIn: "MM en Pouces", inMm: "Pouces en MM", std: "✓ Clé Standard", spec: "Clé Spéciale", sugg: "Suggestion:", thFrac: "Fraction", thDec: "Décimal" },
        de: { title: "Mechaniker Pro ⚡", menu: "Menü", tool1: "mm ⇄ zoll bruch", subCalc: "➤ Rechner", subTables: "➤ Vergleichstabelle", steel: "Stahlstärke (mm - mil)", config: "⚙️ Einstellungen", theme: "Aussehen", lang: "Sprache", calcTab: "Rechner", tableTab: "Tabellen", mode: "Modus", measure: "Maß", prompt: "Maß eingeben...", mmIn: "MM zu Zoll", inMm: "Zoll zu MM", std: "✓ Standard-Schlüssel", spec: "Spezial-Schlüssel", sugg: "Empfehlung:", thFrac: "Bruch", thDec: "Dezimal" }
    };

    const tablaComercial = {"1.5": "1/16\"", "2": "5/64\"", "2.5": "3/32\"", "3": "1/8\"", "4": "5/32\"", "5": "3/16\"", "5.5": "7/32\"", "6": "1/4\"", "8": "5/16\"", "10": "3/8\"", "11": "7/16\"", "12": "15/32\"", "13": "1/2\"", "14": "9/16\"", "15": "19/32\"", "16": "5/8\"", "17": "11/16\"", "19": "3/4\"", "22": "7/8\"", "24": "15/16\"", "25": "1\"", "25.4": "1\""};

    function init() {
        const savedTheme = localStorage.getItem('theme') || 'dark';
        const browserLang = navigator.language.split('-')[0];
        const savedLang = localStorage.getItem('lang') || (translations[browserLang] ? browserLang : 'es');
        
        document.getElementById('themeSelect').value = savedTheme;
        document.getElementById('langSelect').value = savedLang;
        if(savedTheme === 'light') document.body.classList.add('light-mode');
        changeLang();
    }

    function changeLang() {
        const lang = document.getElementById('langSelect').value;
        const t = translations[lang];
        localStorage.setItem('lang', lang);

        document.getElementById('main-title').innerText = t.title;
        document.getElementById('txt-menu-title').innerText = t.menu;
        document.getElementById('txt-menu-tool1').innerText = t.tool1;
        document.getElementById('txt-sub-calc').innerText = t.subCalc;
        document.getElementById('txt-sub-tables').innerText = t.subTables;
        document.getElementById('txt-menu-steel').innerText = t.steel;
        document.getElementById('txt-menu-config').innerText = t.config;
        document.getElementById('txt-label-theme').innerText = t.theme;
        document.getElementById('txt-label-lang').innerText = t.lang;
        document.getElementById('tab-calc').innerText = t.calcTab;
        document.getElementById('tab-tables').innerText = t.tableTab;
        document.getElementById('txt-label-mode').innerText = t.mode;
        document.getElementById('txt-label-measure').innerText = t.measure;
        document.getElementById('opt-mm-in').innerText = t.mmIn;
        document.getElementById('opt-in-mm').innerText = t.inMm;
        document.getElementById('th-frac').innerText = t.thFrac;
        document.getElementById('th-dec').innerText = t.thDec;
        convert();
    }

    function convert() {
        const rawVal = document.getElementById('input').value.trim();
        const mode = document.getElementById('mode').value;
        const resBox = document.getElementById('resBox');
        const lang = localStorage.getItem('lang') || 'es';
        const t = translations[lang];
        
        if (!rawVal) { resBox.innerHTML = `<div style="color: #64748b;">${t.prompt}</div>`; return; }
        const val = procesarEntrada(rawVal);
        if (isNaN(val)) return;

        if (mode === 'mm_to_in') {
            let res = tablaComercial[val] || toFraction(val / 25.4);
            let isStd = !!tablaComercial[val];
            resBox.innerHTML = `<div class="main-res">${res}</div><div class="badge ${isStd ? 'badge-std' : 'badge-spec'}">${isStd ? t.std : t.spec}</div>`;
        } else {
            const mm = val * 25.4;
            resBox.innerHTML = `<div class="main-res">${mm.toFixed(2)}<small style="font-size:1.5rem">mm</small></div><div class="badge badge-std">${t.sugg} ${Math.round(mm)}mm</div>`;
        }
    }

    function procesarEntrada(t) {
        t = t.replace(',', '.').replace('-', ' ').trim();
        if (t.includes(' ')) {
            const p = t.split(/\s+/);
            const f = p[1].split('/');
            return parseFloat(p[0]) + (parseFloat(f[0]) / parseFloat(f[1]));
        } else if (t.includes('/')) {
            const f = t.split('/');
            return parseFloat(f[0]) / parseFloat(f[1]);
        }
        return parseFloat(t);
    }

    function toFraction(dec) {
        const d = 64; let n = Math.round(dec * d); const e = Math.floor(n / d); n = n % d;
        if (n === 0) return e + '"';
        const gcd = (a, b) => b ? gcd(b, a % b) : a;
        const c = gcd(n, d);
        return (e > 0 ? e + " " : "") + (n/c) + "/" + (d/c) + '"';
    }

    function loadTool(toolId, subViewId) {
        document.querySelectorAll('.tool-section').forEach(s => s.classList.remove('active'));
        document.getElementById('section-' + toolId).classList.add('active');
        if(toolId === 'converter') switchSubView(subViewId);
        toggleMenu();
    }

    function switchSubView(viewId) {
        document.querySelectorAll('#section-converter .view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('#section-converter .tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('subview-' + viewId).classList.add('active');
        document.getElementById('tab-' + viewId).classList.add('active');
    }

    function toggleMenu() { document.getElementById('sidebar').classList.toggle('active'); document.getElementById('overlay').classList.toggle('active'); }
    function toggleFolder(id) { document.getElementById(id).classList.toggle('show'); }
    function toggleMode() { document.getElementById('helperBtns').style.display = (document.getElementById('mode').value === 'in_to_mm') ? 'flex' : 'none'; convert(); }
    function addChar(c) { const i = document.getElementById('input'); i.value += c; i.focus(); convert(); }
    function changeTheme() { 
        const theme = document.getElementById('themeSelect').value;
        document.body.classList.toggle('light-mode', theme === 'light');
        localStorage.setItem('theme', theme);
    }

    // Tabla dinámica
    const tableBody = document.getElementById('tableBody');
    const gcdFunc = (a, b) => b ? gcdFunc(b, a % b) : a;
    let tH = '';
    for (let i = 1; i <= 64; i++) {
        const d = i / 64; const m = d * 25.4; const c = gcdFunc(i, 64);
        tH += `<tr><td>${i/c}/${64/c}"</td><td>${m.toFixed(2)}</td><td>${d.toFixed(3)}</td></tr>`;
    }
    tableBody.innerHTML = tH;

    init();
</script>
</body>
</html>
