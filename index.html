<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulgadasFácil ⚡</title>
    <style>
        :root { 
            --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #f1f5f9; 
            --std: #4ade80; --spec: #fbbf24; --sidebar: #1e293b;
        }

        .light-mode {
            --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --sidebar: #f1f5f9; --accent: #0284c7;
        }

        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; transition: 0.3s; overflow-x: hidden; }

        /* MENÚ LATERAL */
        .sidebar {
            width: 280px; background: var(--sidebar); height: 100vh;
            position: fixed; left: -280px; top: 0; transition: 0.3s; z-index: 1000;
            padding: 20px; box-sizing: border-box; border-right: 1px solid rgba(255,255,255,0.1);
        }
        .sidebar.active { left: 0; }
        .menu-item { 
            padding: 15px; border-radius: 12px; cursor: pointer; margin-bottom: 8px;
            display: flex; align-items: center; gap: 12px; transition: 0.2s;
        }
        .menu-item:hover { background: var(--accent); color: white; }

        /* CONTENIDO */
        .main-content { padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .header-bar { width: 100%; max-width: 450px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
        .menu-btn { background: var(--card); border: none; color: var(--text); padding: 12px; border-radius: 12px; cursor: pointer; font-size: 1.2rem; }

        .container { width: 100%; max-width: 450px; }
        .view { display: none; }
        .view.active { display: block; }

        /* ESTILO CALCULADORA (RECUPERADO) */
        .card { background: var(--card); width: 100%; padding: 25px; border-radius: 28px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); text-align: center; box-sizing: border-box; }
        input, select { width: 100%; padding: 16px; background: rgba(0,0,0,0.2); border: 2px solid #334155; border-radius: 14px; color: var(--text); font-size: 1.1rem; margin-top: 5px; outline: none; }
        .result-container { margin-top: 15px; background: rgba(0,0,0,0.2); border-radius: 20px; padding: 20px; min-height: 120px; display: flex; flex-direction: column; justify-content: center; border: 1px solid #334155; }
        .main-res { font-size: 2.8rem; font-weight: 800; color: var(--accent); }
        .badge { display: inline-block; padding: 6px 15px; border-radius: 50px; font-weight: bold; font-size: 0.8rem; margin-top: 10px; text-transform: uppercase; border: 1px solid; }
        .badge-std { background: rgba(74, 222, 128, 0.1); color: var(--std); }
        .badge-spec { background: rgba(251, 191, 36, 0.1); color: var(--spec); }

        /* TABLAS */
        .table-wrapper { max-height: 60vh; overflow-y: auto; border-radius: 12px; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th { background: #334155; color: var(--accent); padding: 12px; text-align: left; position: sticky; top: 0; }
        td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }

        /* CONFIGURACIÓN */
        .config-item { text-align: left; margin-bottom: 20px; }
        .btn-coffee { background: #ffdd00; color: #000; padding: 15px; border-radius: 14px; text-decoration: none; display: block; font-weight: bold; margin-top: 20px; }

        .overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index: 999; }
        .overlay.active { display: block; }
    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <nav class="sidebar" id="sidebar">
        <h2 style="color: var(--accent)">PulgadasFácil</h2>
        <div class="menu-item" onclick="showView('calc')">🔧 Calculadora de Llaves</div>
        <div class="menu-item" onclick="showView('tables')">📊 Tabla de Equivalencias</div>
        <div class="menu-item" onclick="alert('Próximamente nuevas herramientas...')">🧪 Más calculadoras</div>
        <hr style="opacity: 0.1; margin: 20px 0;">
        <div class="menu-item" onclick="showView('config')">⚙️ Configuración</div>
    </nav>

    <main class="main-content">
        <div class="header-bar">
            <button class="menu-btn" onclick="toggleMenu()">☰</button>
            <span id="view-title" style="font-weight: bold; opacity: 0.7;">Calculadora</span>
            <div style="width: 40px;"></div>
        </div>

        <div class="container">
            <div id="view-calc" class="view active">
                <div class="card">
                    <h2 style="margin:0 0 20px 0;">Mecánico Pro ⚡</h2>
                    <select id="mode" onchange="convert()">
                        <option value="mm_to_in">Milímetros a Pulgadas</option>
                        <option value="in_to_mm">Pulgadas a Milímetros</option>
                    </select>
                    <input type="text" id="input" inputmode="decimal" placeholder="Ej: 13 o 1 1/2" oninput="convert()" style="margin-top:15px;">
                    <div class="result-container" id="resBox">
                        <div style="color: #64748b;">Introduce una medida...</div>
                    </div>
                </div>
            </div>

            <div id="view-tables" class="view">
                <div class="card">
                    <input type="text" id="tableSearch" placeholder="🔍 Buscar medida..." oninput="filterTable()" style="margin-bottom:10px;">
                    <div class="table-wrapper">
                        <table>
                            <thead><tr><th>Fracción</th><th>mm</th><th>Decimal</th></tr></thead>
                            <tbody id="tableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div id="view-config" class="view">
                <div class="card">
                    <h3>Ajustes</h3>
                    <div class="config-item">
                        <label>Apariencia</label>
                        <select id="theme-select" onchange="changeTheme()">
                            <option value="dark">🌙 Modo Oscuro</option>
                            <option value="light">☀️ Modo Claro</option>
                        </select>
                    </div>
                    <div class="config-item">
                        <label>Idioma</label>
                        <select>
                            <option>Español</option>
                            <option>English (Soon)</option>
                        </select>
                    </div>
                    <a href="https://www.paypal.me/tuusuario" target="_blank" class="btn-coffee">☕ Invítame un café</a>
                    <p style="font-size: 0.8rem; color: #64748b; margin-top: 15px;">Tu apoyo ayuda a mantener este sitio libre de anuncios molestos.</p>
                </div>
            </div>
        </div>
    </main>

<script>
    const tablaComercial = {"1.5": "1/16\"", "2": "5/64\"", "2.5": "3/32\"", "3": "1/8\"", "4": "5/32\"", "5": "3/16\"", "5.5": "7/32\"", "6": "1/4\"", "8": "5/16\"", "10": "3/8\"", "11": "7/16\"", "12": "15/32\"", "13": "1/2\"", "14": "9/16\"", "15": "19/32\"", "16": "5/8\"", "17": "11/16\"", "19": "3/4\"", "22": "7/8\"", "24": "15/16\"", "25": "1\"", "25.4": "1\""};

    function toggleMenu() {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('overlay').classList.toggle('active');
    }

    function showView(viewId) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById('view-' + viewId).classList.add('active');
        document.getElementById('view-title').innerText = viewId === 'calc' ? 'Calculadora' : (viewId === 'tables' ? 'Tablas' : 'Ajustes');
        toggleMenu();
    }

    function changeTheme() {
        const theme = document.getElementById('theme-select').value;
        document.body.classList.toggle('light-mode', theme === 'light');
    }

    function convert() {
        const rawVal = document.getElementById('input').value.trim();
        const mode = document.getElementById('mode').value;
        const resBox = document.getElementById('resBox');
        if (!rawVal) { resBox.innerHTML = '<div style="color: #64748b;">Esperando...</div>'; return; }
        
        let val = 0;
        if(rawVal.includes(' ')) {
            const parts = rawVal.split(/\s+/);
            const f = parts[1].split('/');
            val = parseFloat(parts[0]) + (parseFloat(f[0])/parseFloat(f[1]));
        } else if(rawVal.includes('/')) {
            const f = rawVal.split('/');
            val = parseFloat(f[0])/parseFloat(f[1]);
        } else { val = parseFloat(rawVal.replace(',','.')); }

        if (isNaN(val)) return;

        if (mode === 'mm_to_in') {
            let res = tablaComercial[val] || toFraction(val / 25.4);
            let isStd = !!tablaComercial[val];
            resBox.innerHTML = `<div class="main-res">${res}</div><div class="badge ${isStd ? 'badge-std' : 'badge-spec'}">${isStd ? 'Llave Estándar' : 'Llave Especial'}</div>`;
        } else {
            const mm = val * 25.4;
            resBox.innerHTML = `<div class="main-res">${mm.toFixed(2)}<small style="font-size:1.5rem">mm</small></div><div class="badge badge-std">Aprox: ${Math.round(mm)}mm</div>`;
        }
    }

    function toFraction(dec) {
        const d = 64;
        let n = Math.round(dec * d);
        const entero = Math.floor(n / d);
        n = n % d;
        if (n === 0) return entero + '"';
        const gcd = (a, b) => b ? gcd(b, a % b) : a;
        const common = gcd(n, d);
        return (entero > 0 ? entero + " " : "") + (n/common) + "/" + (d/common) + '"';
    }

    // Llenar tabla 1/64
    const tableBody = document.getElementById('tableBody');
    let tableHTML = '';
    for (let i = 1; i <= 192; i++) {
        const dec = i / 64;
        const mm = dec * 25.4;
        const whole = Math.floor(i / 64);
        const rem = i % 64;
        let fText = (rem === 0) ? whole + '"' : (whole > 0 ? whole + " " : "") + (rem/64) + '"'; // Simplificado para demo
        tableHTML += `<tr><td>${fText}</td><td>${mm.toFixed(3)}</td><td>${dec.toFixed(4)}</td></tr>`;
    }
    tableBody.innerHTML = tableHTML;

    function filterTable() {
        const q = document.getElementById('tableSearch').value.toLowerCase();
        const rows = tableBody.getElementsByTagName('tr');
        for (let r of rows) { r.style.display = r.innerText.toLowerCase().includes(q) ? '' : 'none'; }
    }
</script>
</body>
</html>
