<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mecánico Pro ⚡</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #f1f5f9; --std: #4ade80; --spec: #fbbf24; --border: rgba(255,255,255,0.05); }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 10px; }
        
        /* HEADER */
        .top-nav { width: 100%; max-width: 450px; display: flex; align-items: center; justify-content: space-between; padding: 10px 0; }
        .menu-btn { background: none; border: none; color: white; font-size: 1.8rem; cursor: pointer; }
        
        .card { background: var(--card); width: 100%; max-width: 420px; padding: 25px; border-radius: 28px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); border: 1px solid var(--border); text-align: center; box-sizing: border-box; }
        h2 { background: linear-gradient(to right, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 1.8rem; margin: 0 0 20px 0; }
        
        /* TABS PARA SECCIONES */
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; width: 100%; max-width: 420px; }
        .tab-btn { flex: 1; padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); color: #94a3b8; cursor: pointer; font-weight: bold; font-size: 0.8rem; }
        .tab-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }

        .input-group { margin-bottom: 20px; text-align: left; position: relative; }
        label { font-size: 0.75rem; text-transform: uppercase; color: #94a3b8; letter-spacing: 1px; margin-left: 5px; }
        select, input { width: 100%; padding: 16px; background: #0f172a; border: 2px solid #334155; border-radius: 14px; color: white; font-size: 1.1rem; margin-top: 5px; box-sizing: border-box; outline: none; }
        
        /* BOTONES DE ENTRADA RÁPIDA (DENTRO DEL INPUT) */
        .input-btns { position: absolute; right: 8px; bottom: 6px; display: none; gap: 5px; }
        .quick-btn { background: var(--accent); color: var(--bg); border: none; border-radius: 10px; width: 42px; height: 42px; font-size: 1.2rem; font-weight: bold; cursor: pointer; }

        .result-container { margin-top: 10px; background: rgba(15, 23, 42, 0.6); border-radius: 20px; padding: 25px; border: 1px solid #334155; min-height: 140px; display: flex; flex-direction: column; justify-content: center; transition: 0.3s; }
        .main-res { font-size: 3rem; font-weight: 800; color: var(--accent); line-height: 1; }
        .badge { display: inline-block; padding: 6px 16px; border-radius: 50px; font-weight: bold; font-size: 0.8rem; margin-top: 15px; text-transform: uppercase; }
        .badge-std { background: rgba(74, 222, 128, 0.2); color: var(--std); border: 1px solid var(--std); }
        .badge-spec { background: rgba(251, 191, 36, 0.2); color: var(--spec); border: 1px solid var(--spec); }
        
        /* TABLAS ESTILO MECÁNICO */
        .table-view { display: none; width: 100%; max-width: 420px; }
        .table-view.active { display: block; }
        .table-wrap { background: var(--card); border-radius: 20px; border: 1px solid var(--border); overflow: hidden; }
        .scroll-area { max-height: 60vh; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th { background: #0f172a; padding: 12px; color: var(--accent); position: sticky; top: 0; }
        td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); text-align: center; }
        .sticky-col { position: sticky; left: 0; background: #1e293b; font-weight: bold; border-right: 1px solid #334155; }

        .history-section { margin-top: 25px; text-align: left; border-top: 1px solid #334155; padding-top: 15px; width: 100%; }
        .history-item { background: #16213e; padding: 10px 15px; border-radius: 10px; margin-bottom: 8px; font-size: 0.85rem; display: flex; justify-content: space-between; cursor: pointer; }
    </style>
</head>
<body>

<div class="tabs">
    <button class="tab-btn active" onclick="switchTab('calc')">Calculadora</button>
    <button class="tab-btn" onclick="switchTab('steel')">Acero</button>
    <button class="tab-btn" onclick="switchTab('wire')">Cables</button>
</div>

<div id="view-calc" class="table-view active">
    <div class="card">
        <h2>Mecánico Pro ⚡</h2>
        <div class="input-group">
            <label>Modo</label>
            <select id="mode" onchange="toggleMode()">
                <option value="mm_to_in">Milímetros a Pulgadas</option>
                <option value="in_to_mm">Pulgadas a Milímetros</option>
            </select>
        </div>
        <div class="input-group">
            <label>Medida</label>
            <input type="text" id="input" inputmode="decimal" placeholder="Ej: 13 o 1 1/2" oninput="convert()">
            <div id="inputBtns" class="input-btns">
                <button class="quick-btn" onclick="addChar(' ')">␣</button>
                <button class="quick-btn" onclick="addChar('/')">/</button>
            </div>
        </div>
        <div class="result-container" id="resBox">
            <div style="color: #475569;">Introduce una medida...</div>
        </div>
        <div class="history-section" id="historySection" style="display:none;">
            <div id="historyList"></div>
        </div>
    </div>
</div>

<div id="view-steel" class="table-view">
    <div class="table-wrap">
        <div style="padding:15px; color:var(--accent); font-weight:bold; text-align:center;">Calibres de Acero (mm - pulg)</div>
        <div class="scroll-area">
            <table>
                <thead><tr><th>Cal</th><th>mm</th><th>pulg</th><th>kg/m²</th></tr></thead>
                <tbody id="steelBody"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="view-wire" class="table-view">
    <div class="table-wrap">
        <div style="padding:15px; color:var(--accent); font-weight:bold; text-align:center;">Comparativa AWG / BWG / SWG</div>
        <div class="scroll-area">
            <table>
                <thead>
                    <tr><th rowspan="2">CAL</th><th colspan="2">BWG</th><th colspan="2">AWG</th></tr>
                    <tr><th>mm</th><th>pulg</th><th>mm</th><th>pulg</th></tr>
                </thead>
                <tbody id="wireBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const tablaComercial = { "1.5": "1/16\"", "2": "5/64\"", "2.5": "3/32\"", "3": "1/8\"", "4": "5/32\"", "5": "3/16\"", "5.5": "7/32\"", "6": "1/4\"", "8": "5/16\"", "10": "3/8\"", "11": "7/16\"", "12": "15/32\"", "13": "1/2\"", "14": "9/16\"", "15": "19/32\"", "16": "5/8\"", "17": "11/16\"", "19": "3/4\"", "22": "7/8\"", "24": "15/16\"", "25": "1\"", "25.4": "1\"" };

    const steelData = [ ["1/2\"", "12.70", "0.500", "99.69"], ["7/16\"", "11.11", "0.438", "87.21"], ["3/8\"", "9.53", "0.375", "74.81"], ["5/16\"", "7.94", "0.313", "62.32"], ["1/4\"", "6.35", "0.250", "49.84"], ["3", "6.07", "0.239", "47.65"], ["4", "5.69", "0.224", "44.66"], ["10", "3.42", "0.135", "26.84"], ["1/8\"", "3.18", "0.125", "24.96"], ["20", "0.91", "0.036", "7.14"], ["34", "0.21", "0.008", "1.64"] ];

    const wireData = [ ["7/0", "-", "-", "12.45", "0.49"], ["6/0", "14.73", "0.58", "11.67", "0.46"], ["1", "7.62", "0.30", "7.38", "0.28"], ["10", "3.40", "0.13", "2.58", "0.10"], ["20", "0.88", "0.03", "0.81", "0.03"], ["40", "-", "-", "0.07", "0.00"] ];

    let historial = [];

    function switchTab(tab) {
        document.querySelectorAll('.table-view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('view-' + tab).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    function toggleMode() {
        const mode = document.getElementById('mode').value;
        document.getElementById('inputBtns').style.display = (mode === 'in_to_mm') ? 'flex' : 'none';
        convert();
    }

    function addChar(c) {
        const input = document.getElementById('input');
        input.value += c;
        input.focus();
        convert();
    }

    function convert() {
        const rawVal = document.getElementById('input').value.trim();
        const mode = document.getElementById('mode').value;
        const resBox = document.getElementById('resBox');
        if (!rawVal) { resBox.innerHTML = '<div style="color: #475569;">Esperando...</div>'; return; }
        
        const val = procesarEntrada(rawVal);
        if (isNaN(val) || val <= 0) { resBox.innerHTML = '<div style="color: #ef4444;">Formato no válido</div>'; return; }

        let resPrincipal = "", resBadge = "", resExtra = "";

        if (mode === 'mm_to_in') {
            let res = tablaComercial[val] ? tablaComercial[val] : toFraction(val / 25.4);
            let isStd = tablaComercial[val] ? true : false;
            resPrincipal = res;
            resBadge = `<div class="badge ${isStd ? 'badge-std' : 'badge-spec'}">${isStd ? '✓ Llave Estándar' : 'Llave Especial'}</div>`;
            resExtra = `<div class="exact-val">Decimal: ${(val/25.4).toFixed(4)}"</div>`;
        } else {
            const mm = val * 25.4;
            resPrincipal = mm.toFixed(2) + '<span style="font-size:1.5rem">mm</span>';
            resBadge = `<div class="badge badge-std">Sugerencia: ${Math.round(mm)}mm</div>`;
            resExtra = `<div class="exact-val">Entrada: ${rawVal}"</div>`;
        }

        resBox.innerHTML = `<div class="main-res">${resPrincipal}</div>${resBadge}${resExtra}`;
        actualizarHistorial(rawVal, resPrincipal.replace(/<[^>]*>?/gm, ''), mode);
    }

    function procesarEntrada(texto) {
        texto = texto.replace(',', '.').replace('-', ' ').trim();
        if (texto.includes(' ')) {
            const partes = texto.split(/\s+/);
            if (partes[1] && partes[1].includes('/')) {
                const f = partes[1].split('/');
                return parseFloat(partes[0]) + (parseFloat(f[0]) / parseFloat(f[1]));
            }
        } else if (texto.includes('/')) {
            const f = texto.split('/');
            return parseFloat(f[0]) / parseFloat(f[1]);
        }
        return parseFloat(texto);
    }

    function toFraction(dec) {
        const denominators = [2, 4, 8, 16, 32, 64];
        let bestNum = 0, bestDen = 1, minDiff = Infinity;
        for (let d of denominators) {
            let n = Math.round(dec * d);
            let diff = Math.abs(dec - n / d);
            if (diff < minDiff) { minDiff = diff; bestNum = n; bestDen = d; }
        }
        const entero = Math.floor(bestNum / bestDen);
        let residuoNum = bestNum % bestDen;
        if (residuoNum === 0) return entero + '"';
        const gcd = (a, b) => b ? gcd(b, a % b) : a;
        const common = gcd(residuoNum, bestDen);
        residuoNum /= common;
        const denFinal = bestDen / common;
        return (entero > 0 ? entero + " " : "") + residuoNum + "/" + denFinal + '"';
    }

    function actualizarHistorial(entrada, salida, modo) {
        if (historial.length > 0 && historial[0].entrada === entrada) return;
        historial.unshift({ entrada, salida, modo });
        if (historial.length > 3) historial.pop();
        const list = document.getElementById('historyList');
        document.getElementById('historySection').style.display = 'block';
        list.innerHTML = historial.map(item => `
            <div class="history-item">
                <span style="color:#94a3b8">${item.entrada}</span>
                <span style="color:var(--accent); font-weight:bold">${item.salida}</span>
            </div>
        `).join('');
    }

    function init() {
        const sBody = document.getElementById('steelBody');
        steelData.forEach(r => sBody.innerHTML += `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`);
        const wBody = document.getElementById('wireBody');
        wireData.forEach(r => wBody.innerHTML += `<tr><td class="sticky-col">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td></tr>`);
    }

    init();
</script>
</body>
</html>
